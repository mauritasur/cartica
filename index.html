<title>Una carta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap">
<style>
:root{--bd1:#f8e3e6;--bd2:#e8b6c2;--ink:#5b3a42;--gold:#c9a46a;--rose:#e58fa5;--paper:#fcf3e8;--paper2:#f4dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd1:#4d2c39;--bd2:#2a1420}}
:root[data-theme="dark"]{--bd1:#4d2c39;--bd2:#2a1420}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bd2);background:radial-gradient(ellipse at 50% 35%,var(--bd1),var(--bd2));display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;font-family:'EB Garamond',Georgia,serif;color:var(--ink)}
.book{position:relative;width:var(--w);height:var(--h);perspective:2400px;margin:14px 0 6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.book::before{content:'';position:absolute;inset:0;border-radius:3px 12px 12px 3px;box-shadow:3px 3px 0 #ecd2c6,6px 6px 0 #e0c0b3,0 24px 44px rgba(80,30,45,.38)}
.pg{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,.05,.25,1),opacity .2s}
.pg.t{transform:rotateY(-180deg);opacity:0;pointer-events:none;transition:transform 1s cubic-bezier(.6,.05,.25,1),opacity .3s .7s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 12px 12px 3px;overflow:hidden}
.front{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .35 0 0 0 0 .3 0 0 0 .13 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"),radial-gradient(ellipse at 50% 40%,#fffaf2,var(--paper) 55%,#f3d9d2);box-shadow:inset 14px 0 18px -10px rgba(120,60,70,.4),inset 0 0 40px rgba(214,150,150,.25);display:flex;padding:12.5% 12.5%}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#ecd0c8,var(--paper2))}
.bd{position:absolute;inset:3%;border:1px solid rgba(201,164,106,.6);border-radius:4px;pointer-events:none}
.bd::after{content:'';position:absolute;inset:3px;border:1px dotted rgba(201,164,106,.5);border-radius:3px}
.front::before,.front::after{content:'';position:absolute;left:8%;right:5%;height:6px;background:radial-gradient(circle at 50% 100%,transparent 2.5px,rgba(201,164,106,.55) 3px 3.8px,transparent 4.3px) 0 0/10px 6px repeat-x;opacity:.7}
.front::before{top:4.8%}.front::after{bottom:4.8%;transform:scaleY(-1)}
.inner{flex:1;min-height:0;min-width:0;display:flex;align-items:center;overflow:hidden;position:relative;z-index:1}
.col{width:100%;font-size:var(--fs);line-height:1.6;font-weight:500}
.col p{margin:0}.col p+p,.ti+p{margin-top:.95em}.col p.c{text-align:center}
.ti{font-family:'Great Vibes','Brush Script MT',cursive;font-size:1.9em;line-height:1.2;text-align:center;color:#b4536f;margin-bottom:.7em}
.d{position:absolute;width:8.5%;height:auto;aspect-ratio:1;z-index:0}
.d.h{width:4.8%;color:var(--rose)}.d.s{width:4.2%;color:#d9b36f;animation:tw 3.4s ease-in-out infinite}
.tl{top:3.8%;left:3.8%}.tr{top:3.8%;right:3.8%}.bl{bottom:3.8%;left:3.8%}.br{bottom:3.8%;right:3.8%}
.mx{transform:scaleX(-1)}.my{transform:scaleY(-1)}.mxy{transform:scale(-1)}
.sig{text-align:center;margin-top:1.1em}
.sig .M{font-family:'Great Vibes','Brush Script MT',cursive;font-size:3.1em;line-height:1.1;color:#b4536f}
.sig .row{display:flex;justify-content:center;align-items:center;gap:.45em;margin-top:.2em}
.sig svg{width:1.15em;height:1.15em}.sig .hh{color:var(--rose)}.sig .ss{color:#d9b36f;width:.8em;height:.8em;animation:tw 3s ease-in-out infinite}
.cv .front{padding:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px),radial-gradient(ellipse at 50% 40%,#f3b8c6,#dd8fa5 60%,#c97790);box-shadow:inset 0 0 50px rgba(120,30,60,.35)}
.cv .front::before,.cv .front::after{display:none}
.cv .sp{position:absolute;inset:0;background:linear-gradient(90deg,rgba(110,30,60,.5),transparent 9%)}
.cv .bd{border-color:#ecd29a;inset:4%}.cv .bd::after{border-color:rgba(236,210,154,.7)}
.cv .d{width:13%;opacity:.95}.cv .tl{top:6%;left:7%}.cv .tr{top:6%;right:6%}.cv .bl{bottom:6%;left:7%}.cv .br{bottom:6%;right:6%}
.emb{position:absolute;left:19%;width:62%;top:50%;transform:translateY(-50%);animation:pulse 3.8s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(100,20,50,.35))}
.cv{cursor:pointer}
.ct{display:flex;align-items:center;gap:18px;margin:10px 0 16px;opacity:0;transition:opacity .6s;pointer-events:none}
.ct.on{opacity:1;pointer-events:auto}
.ct button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,164,106,.8);background:linear-gradient(#fdeef0,#f1c3cf);box-shadow:0 3px 8px rgba(90,30,50,.25);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .2s,opacity .2s}
.ct button:active{transform:scale(.92)}.ct button:disabled{opacity:.35;cursor:default}
.ct svg{width:18px;height:18px;fill:none;stroke:#a8506a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#pn{min-width:70px;text-align:center;font-size:17px;color:#7a4a58;letter-spacing:.04em}
:root[data-theme="dark"] #pn,:root:not([data-theme="light"]) #pn{color:#f1c8d2}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #pn{color:#7a4a58}}
.fh{position:fixed;left:50%;top:48%;width:16px;height:16px;color:var(--rose);pointer-events:none;animation:rise 3.4s ease-out forwards;z-index:50}
.bs{position:fixed;width:12px;height:12px;color:#e8c98a;pointer-events:none;animation:tw 4s ease-in-out infinite;z-index:0}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--x),-220px) scale(1.1)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.95;transform:scale(1.1)}}
@keyframes pulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pg,.pg.t{transition-duration:.01s!important}}
</style>
</head>

<script>
const L=[
"Para mi niña, Salo. 💗",
"no sé ni por dónde empezar esta carta, mrc, porque siento que tengo demasiadas cosas guardadas y que aunque escribiera páginas y páginas todavía me quedarían mil cosas por decirte. pero quería intentarlo, y esta vez no quiero hablarte desde una pelea, ni desde el enojo, ni desde esa desesperación horrible que he tenido estos días de querer que me respondas y que todo se arregle ya, quiero hablarte desde lo que realmente siento por ti, desde todo ese amor que te tengo y que, aunque ahora mismo estemos pasando por uno de los momentos más difíciles que hemos tenido, sigue estando aquí.",
"porque Salo, yo te amo muchísimo, mujer. y sé que te lo he dicho demasiadas veces, probablemente tantas que ya te lo sabes de memoria, pero siento que decir simplemente “te amo” se queda demasiado pequeño para todo lo que siento por ti. yo te amo de una manera que hasta a mí misma me sorprende, porque nunca había sentido esto por alguien, nunca había mirado a una persona y pensado tantas veces “quiero que sea ella”, nunca había imaginado tantas cosas de mi vida al lado de alguien y contigo sí me pasa, contigo me imagino mis días, mis planes, mis bobadas, mis momentos bonitos, mis logros, mis días malos, mis cumpleaños, los tuyos, las cosas que todavía nos faltan por conocer, los lugares a los que podríamos ir, las noches hablando de cualquier estupidez, los abrazos, las risas, todo, pero sobre todo me imagino una vida contigo, una familia contigo, un futuro contigo, aunque sea complejo.",
"y no te digo esto para ponerte encima la responsabilidad de cumplir ese futuro conmigo ni para que sientas que tienes que querer lo mismo solo porque yo lo quiero, te lo digo porque eso es lo que realmente hay dentro de mí cuando pienso en ti. yo no estaba jugando cuando te decía que eras la mujer con la que quería todo, eras tú, sigues siendo tú, y aunque ahora mismo no sé qué vaya a pasar después de estos días, no quiero mentirte diciendo que de repente dejé de imaginar esas cosas solamente porque estamos pasando por un momento horrible. no, yo sigo queriendo eso, sigo queriendo que algún día podamos mirar atrás y decir “mrc, qué cantidad de cosas tuvimos que aprender para poder llegar hasta aquí”, sigo queriendo tener una vida contigo, seguir viéndote cumplir tus sueños, estar orgullosa de ti, que tú estés orgullosa de mí, hacer planes contigo, salir contigo, conocer lugares contigo, tener días tranquilos contigo, acostarme a tu lado y hablar de cualquier bobada hasta quedarnos dormidas, molestarte, reírme contigo y, sobre todo, seguir abrazándote.",
"y mrc, cuánto extraño abrazarte. creo que una de las cosas que más me duele de todo esto es pensar que ahora mismo no puedo simplemente ir a buscarte, abrazarte y quedarme contigo un rato, porque a veces siento que eso es lo único que necesito, tenerte enfrente, mirarte, abrazarte, sentir que estás ahí y no tener que solucionar nada durante un rato, solamente estar contigo. extraño muchísimo esas cosas que quizás parecen pequeñas, pero para mí nunca lo fueron, extraño nuestras conversaciones, nuestras bobadas, contarte cualquier cosa, preguntarte cómo estás, saber de ti, escucharte, cuando me daban ganas de decirte cualquier estupidez y sabía que podía ir y contártela, extraño tenerte en mi día.",
"y sí, tú te convertiste en una parte enorme de mi día a día, y obviamente sé que también existe apego, cómo no va a existir si llevas tanto tiempo siendo parte de mi vida, pero no quiero que pienses que todo lo que siento por ti es solamente porque me acostumbré a tenerte. no, Salo, yo te amo por quien eres, amo a la mujer que conocí, a la niña que fui descubriendo poquito a poquito, tus formas, tus ocurrencias, tu manera de hablar, tus gestos, las cosas que me hacen reír, incluso esas cosas tuyas que quizás tú ni siquiera notas que adoro, te amo porque eres tú, y por eso mismo me duele tanto imaginar que quizás tú ya no quieras ese futuro que yo sigo viendo contigo.",
"eso es lo que más me rompe, no solamente pensar en dejar de hablar contigo o dejar de verte, sino pensar que quizás la persona con la que yo quería construir tantas cosas ya no quiere construirlas conmigo. y no te voy a mentir, eso me destroza, porque yo sí quería que fueras tú, yo sí quería que fueras la mujer con la que pudiera decir “mira, llegamos hasta aquí juntas”, yo sí quería que algún día pudiéramos mirar todo lo que vivimos y sentir orgullo de no habernos rendido cuando las cosas se pusieron difíciles, pero ajam.",
"y sé que probablemente en este momento tú estés cansada de escuchar y escuchar que podemos mejorar, porque tú misma me dijiste que hemos hablado de mejoras muchas veces y después vuelve a pasar algo, y yo no quiero ignorar eso, no quiero decirte simplemente “esta vez sí” y esperar que mágicamente me creas, entiendo por qué estás cansada, entiendo que quieras tranquilidad, entiendo que estés cansada de pensar si hice algo, si me enojé, si estoy triste, si algo me molestó, si va a volver a empezar una discusión. creo que ahora entiendo un poquito más lo que me estabas tratando de decir, porque yo muchas veces me quedo demasiado metida en lo que estoy sintiendo y en el miedo de que algo esté mal entre nosotras y termino haciendo que tú también tengas que cargar con eso, y no quiero que estar conmigo se sienta así.",
"no quiero que amarme signifique que tengas que estar preocupándote todo el tiempo, no quiero que tengas que sentir que tienes que caminar con cuidado conmigo, no quiero eso para ti y tampoco quiero eso para mí. yo quiero que podamos estar tranquilas, quiero poder estar contigo sin estar pensando que en cualquier momento todo se va a acabar, quiero que tú puedas estar conmigo sin sentir que tienes que estar pendiente de cada cosa que hago o digo, quiero que podamos hablar sin que una conversación termine convirtiéndose en otra pelea, quiero que podamos decir “esto me molestó” sin atacarnos, quiero aprender a manejar mis cosas mejor, quiero aprender a no reaccionar desde el miedo, quiero aprender a darte tranquilidad y no porque quiera convertirme en alguien completamente diferente para que te quedes conmigo, sino porque yo también quiero aprender a amar mejor.",
"y sé que tú también tienes cosas que aprender, no porque seas mala conmigo ni porque todo sea culpa tuya, sino porque somos dos personas que hemos cometido errores y que muchas veces hemos terminado haciéndonos daño sin querer. y eso es justamente lo que me cuesta aceptar, que después de todo lo que hemos vivido, después de todo el amor que nos hemos tenido, después de todo lo bonito, terminemos pensando que la única manera de estar tranquilas es dejarnos.",
"yo sé que quizás ahora mismo tú no lo ves como yo y lo respeto, pero yo todavía siento que existe otra posibilidad, no una posibilidad de seguir exactamente igual, porque yo tampoco quiero eso, no quiero seguir en el mismo bucle, no quiero seguir peleando por las mismas cosas, no quiero que nos prometamos cambios que duran unos días y después volvamos a lo mismo, yo quiero algo diferente. quiero que, si alguna vez tú me das esa oportunidad, podamos hacerlo diferente de verdad, poco a poco, sin querer solucionar mil cosas en un día, sin pensar que una conversación incómoda significa que todo está perdido, sin que cada vez que algo nos duela terminemos alejándonos y dejando todo a medias.",
"yo quisiera que pudiéramos sentarnos y decir “bueno, ¿qué nos está haciendo daño realmente?”, y encontrarlo, no para buscar culpables, sino para entendernos, para saber qué tenemos que cambiar cada una y para encontrar una forma de querernos que no nos esté destruyendo. y si me preguntas si yo estaría dispuesta a hacerlo, sí, mrc, sí, si tú me dieras una oportunidad yo lo intentaría con todo lo que tengo.",
"pero tampoco quiero que pienses que cuando digo que quiero hacerte el triple de feliz significa que tengo que hacer cualquier cosa para que no te vayas o que tengo que compensarte por algo, lo que quiero decir es que quiero aprender a hacerte sentir querida, quiero que estar conmigo vuelva a sentirse bonito, quiero que puedas mirarme y sentir tranquilidad, quiero que puedas decir “esta es mi mujer” y sentirte feliz de estar conmigo, quiero cuidarte, escucharte, entenderte, respetar tus espacios jajaj, que bueno me cuesta pero ajá, quiero que tengas tu vida, tus cosas y tus momentos y que eso no haga que yo sienta que te estoy perdiendo, quiero aprender a confiar sin estar buscando constantemente seguridad, quiero que podamos tener una relación donde las dos podamos respirar.",
"no quiero vivir con miedo de perderte, quiero vivir contigo.",
"y sé que eso no se arregla con una carta, sé que no basta con decirte que te amo, sé que no basta con decirte que voy a cambiar y sé que al final las cosas se demuestran con lo que uno hace, pero necesitaba que supieras que yo sí estoy dispuesta a hacer ese esfuerzo, no solamente porque tenga miedo de estar sola, sino porque te amo a ti. porque cuando pienso en quién quiero a mi lado, pienso en ti, cuando pienso en quién quiero abrazar, pienso en ti, cuando pienso en quién quiero contarle mis cosas, pienso en ti, cuando pienso en con quién quiero construir una familia, pienso en ti, cuando pienso en mi futuro, siempre terminas apareciendo solo tú.",
"y sé que quizás todo esto pueda parecer demasiado para alguien que ahora mismo solo quiere tranquilidad, por eso no quiero que lo leas como una presión. no quiero que pienses que porque yo te amo así tienes que quedarte, no. yo quiero que si algún día eliges quedarte sea porque tú también quieres, porque tú también sientes que vale la pena, porque tú también quieres intentarlo. quiero que estés conmigo por amor, no por culpa, ni por miedo a hacerme daño, ni porque yo esté llorando jajaj.",
"yo quiero que seas feliz. y sí, sé que te he dicho muchas veces que soy feliz si tú eres feliz y lo siento de verdad, quiero que estés bien incluso si ahora mismo no estás bien conmigo, quiero que puedas tener tranquilidad, quiero que puedas descansar, quiero que puedas trabajar sin estar pensando en nuestras peleas, quiero que puedas vivir tu día sin sentir que tienes que estar pendiente de mí, pero también quiero que algún día, si todavía queda una parte de ti que quiere estar conmigo, podamos encontrar una manera de que las dos seamos felices juntas.",
"porque eso es lo que yo quiero. no quiero simplemente tenerte, quiero que tú quieras estar conmigo, quiero que estar conmigo te haga bien, que podamos sentirnos cómo un hogar sin convertirnos en una carga la una para la otra.",
"y mrc, Salo, yo no sé cómo explicarte todo lo que me duele pensar que quizás no quieras eso conmigo, porque tú para mí no eres una persona cualquiera que puedo reemplazar. no estoy pensando “bueno, habrá otra”, no quiero otra, no estoy mirando hacia otro lado, no estoy pensando en quién podría llegar después, yo te estoy mirando solo a ti. y sé que la vida es enorme y que nadie puede saber qué va a pasar mañana, pero hoy, desde donde estoy, yo sé lo que quiero, solo a ti.",
"y por eso mismo me duele tanto, porque tú eres la persona con la que yo quería todo, la persona con la que quería seguir haciendo recuerdos, la persona a la que quería seguir conociendo, la persona que quería ver cumplir sus sueños, la persona a la que quería cuidar, la persona a la que quería decirle “mira, logramos esto”, la persona con la que quería tener una familia, la persona con la que quería compartir el resto de mi vida.",
"y si algún día me preguntas qué fue lo que más quise durante todo esto, probablemente te diría algo muy sencillo: quererte y que pudiéramos estar bien. eso era todo. no necesitaba una relación perfecta, no necesitaba que nunca peleáramos, no necesitaba que todo fuera bonito todos los días, solo quería que pudiéramos aprender a volver la una hacia la otra sin dañarnos cada vez que algo doliera.",
"y todavía quiero eso. todavía quiero a mi flaquita, todavía quiero a mi mujer. y no sé si algún día tú vas a volver a quererme de la misma manera en que yo te estoy queriendo ahora, no sé si después de ese “tiempo” vas a sentirte diferente, no sé qué vas a pensar, no sé qué va a pasar, y aunque me muero de miedo por eso, no quiero inventarme una respuesta ahora.",
"solo sé lo que pienso hoy, hoy te amo, te extraño, hoy quiero abrazarte, hoy quiero que estés conmigo.hoy sigo creyendo que podríamos hacerlo diferente si las dos realmente quisiéramos.",
"y si algún día tú decides darme esa oportunidad, no quiero desperdiciarla. quiero demostrarte con calma, no con mil palabras, que puedo aprender, quiero que tú también puedas decirme tus cosas, quiero que podamos crecer juntas, quiero que podamos mirar todo esto no como el final de todo, sino como el momento en que entendimos que teníamos que aprender a querernos de otra manera.",
"porque yo no quiero que lo que hemos vivido quede reducido a solo nuestras peleas. quiero recordar también todo lo bonito, cómo empezamos, nuestras conversaciones, nuestros momentos, nuestros abrazos, nuestras bobadas, todas las veces que nos dijimos que nos amábamos, todas las veces que me emocioné por verte, todas las veces que me hiciste sentir amada, porque todo eso también somos nosotras.",
"y quiero que tú también recuerdes que, con todos mis errores, yo te amé de verdad, te amé muchísimo.",
"te amo muchísimo, y no me da pena decirlo.",
"quizás ahora mismo estoy llorando como una boba escribiéndote esto, quizás estoy hecha mierda, pero incluso así, entre todo esto, te amo.",
"y no quiero que pienses que lo que siento por ti es solamente miedo a perderte. sí, tengo miedo, muchísimo, y sé que muchas veces estos días me he dejado llevar demasiado por la ansiedad, por la tristeza y por ese miedo, pero incluso en medio de todo eso, cada segundo me acuerdo de ti, de tus ojos, de tu sonrisa, de tu carita, de tu risa, de tus bobadas, de todas esas cositas tuyas que amo tanto y que quizás tú ni siquiera sabes cuánto significan para mí. me haces una falta inmensa, mujer. extraño tu voz, extraño escucharte, extraño hablar contigo, extraño tenerte en mi día, extraño hasta esas bobadas que quizás parecen insignificantes, pero que para mí siempre fueron parte de lo bonito de tenerte. y debajo de todo ese miedo sigue estando el amor, ese amor que quiere verte feliz, que quiere verte crecer, que quiere cuidarte, que quiere compartir una vida contigo, que quiere aprender, que quiere que algún día podamos estar juntas y sentir que todo esto valió la pena.",
"y si algún día lees esto después de que haya pasado todo este caos, quiero que recuerdes eso. no quiero que recuerdes solamente a la Mau llorando, ni solamente a la Mau insistiendo jajajja, quiero que recuerdes a la que te miraba con todo el amor del mundo, a la que se emocionaba por verte, que quería contarte hasta la bobada más pequeña, que quería abrazarte, que soñaba contigo, que quería construir una familia contigo, que quería que fueras feliz y que, incluso cuando se equivocaba, te amaba con todo lo que tenía.",
"mi niña, yo no sé qué va a pasar, pero sí sé algo: no quiero despedirme de ti. no quiero escribirte como si esto fuera el final, no quiero cerrar nuestra historia en medio de todo este dolor. yo todavía quiero que exista un “nosotras”, todavía quiero que exista un “después”, todavía quiero que algún día podamos hablar tranquilas, mirarnos y entendernos, abrazarnos, reírnos, hacer planes y seguir teniendo una vida juntas.",
"y sobre todo, todavía quiero quererte. porque tú eres mi niña, mi flaquita, mi Salo, la mujer que amo, la mujer que extraño, la mujer con la que quiero todo, y aunque ahora mismo no sepa si tú sigues queriendo lo mismo conmigo, yo no voy a mentirte sobre lo que hay dentro de mí.",
"ojalá algún día puedas entender aunque sea un poquito todo lo que significas para mí, ojalá puedas sentir aunque sea por un momento todo ese amor que tantas veces no he sabido expresar de la mejor manera. y si alguna vez me das la oportunidad de demostrarte que podemos hacerlo diferente, voy a estar ahí, y no para prometerte una relación perfecta, sino para aprender contigo, para escucharte, para cuidarte, para respetarte, para hacer las cosas mejor, para volver a encontrarnos y para intentar que algún día podamos decir “sí se podía, solo necesitábamos aprender cómo”.",
"te amo, Salo, muchísimo. te extraño con toda mi vida y no sabes cuánto quisiera tenerte aquí conmigo ahora mismo, solo abrazarte y tenerte cerquita, solo a mi niña. 💗"
];

const $=id=>document.getElementById(id), book=$('book'), cover=$('cover'), ct=$('ct');
let pages=[], p=0, lastKey='';
const U=(id,c)=>`<svg class="${c}"><use href="#${id}"/></svg>`;
const DECO=[
 U('rose','d tl')+U('rose','d br mxy')+U('hrt','d h tr')+U('spk','d s bl'),
 U('rose','d tr mx')+U('rose','d bl my')+U('hrt','d h tl')+U('spk','d s br'),
 U('hrt','d h tl')+U('hrt','d h br')+U('spk','d s tr')+U('spk','d s bl')+U('rose','d tr mx')+U('rose','d bl my'),
 U('rose','d tl')+U('rose','d tr mx')+U('hrt','d h bl')+U('hrt','d h br')+U('spk','d s br')
];
const over=c=>c.col.offsetHeight>c.inner.clientHeight+0.5;
function mk(){
  const pg=document.createElement('div'); pg.className='pg';
  pg.innerHTML='<div class="face front"><div class="bd"></div><div class="inner"><div class="col"></div></div></div><div class="face back"></div>';
  book.appendChild(pg);
  const c={pg,front:pg.firstChild,inner:pg.querySelector('.inner'),col:pg.querySelector('.col')};
  pages.push(c); return c;
}
function para(t,cls){const q=document.createElement('p'); if(cls)q.className=cls; q.textContent=t; return q;}
function split(t,cur,cls){
  const tk=t.replace(/([.!?…])\s+/g,'$1\u0001').split('\u0001');
  let i=0,q=null,acc='';
  while(i<tk.length){
    if(!q){q=para('',cls);cur.col.appendChild(q);acc='';}
    const s=acc?acc+' '+tk[i]:tk[i];
    q.textContent=s;
    if(!over(cur)){acc=s;i++;continue;}
    q.textContent=acc;
    if(acc===''){
      cur.col.removeChild(q);q=null;
      if(cur.col.children.length){cur=mk();continue;}
      const w=tk[i].split(' ');
      if(w.length>1){tk.splice(i,1,...w);continue;}
      q=para(tk[i],cls);cur.col.appendChild(q);acc=tk[i];i++;
    } else {q=null;cur=mk();}
  }
  return cur;
}
function addPar(t,cur){
  const cls=t.length<90?'c':'';
  const q=para(t,cls); cur.col.appendChild(q);
  if(!over(cur))return cur;
  cur.col.removeChild(q);
  if(pages.length>1&&cur.col.children.length){
    const n=mk(); n.col.appendChild(para(t,cls));
    if(!over(n))return n;
    n.pg.remove();pages.pop();
  }
  return split(t,cur,cls);
}
function sigEl(){
  const d=document.createElement('div'); d.className='sig';
  d.innerHTML='<div class="M">M</div><div class="row">'+U('spk','ss')+U('hrt','hh')+U('rose','')+U('hrt','hh')+U('rose','')+U('hrt','hh')+U('spk','ss')+'</div>';
  return d;
}
function build(){
  book.querySelectorAll('.pg:not(.cv)').forEach(e=>e.remove()); pages=[];
  let cur=mk();
  const h=document.createElement('div'); h.className='ti'; h.textContent=L[0]; cur.col.appendChild(h);
  for(let i=1;i<L.length;i++)cur=addPar(L[i],cur);
  let last=pages[pages.length-1]; const s=sigEl(); last.col.appendChild(s);
  if(over(last)){
    last.col.removeChild(s); const lp=last.col.lastElementChild;
    const n=mk(); n.col.appendChild(lp); n.col.appendChild(s);
  }
  const N=pages.length;
  pages.forEach((c,i)=>{c.pg.style.zIndex=N-i+1; c.front.insertAdjacentHTML('afterbegin',DECO[i%4]);});
  cover.style.zIndex=N+5;
  const got=pages.map(c=>[...c.col.querySelectorAll('p')].map(x=>x.textContent).join(' ')).join(' ').replace(/\s+/g,' ').trim();
  const exp=L.slice(1).join(' ').replace(/\s+/g,' ').trim();
  console.log(got===exp?'Carta completa y sin duplicados ('+N+' páginas)':'ATENCIÓN: el texto no coincide');
}
function size(){
  const vw=innerWidth,vh=innerHeight,r=vw<600?1.5:1.36;
  let w=Math.min(vw-28,480),h=w*r,mh=vh-120;
  if(h>mh){h=Math.max(mh,420);w=Math.min(h/r,vw-28);}
  const s=document.documentElement.style;
  s.setProperty('--w',w+'px');s.setProperty('--h',h+'px');
  s.setProperty('--fs',Math.max(15.5,Math.min(19,w*.046))+'px');
  return Math.round(w)+'x'+Math.round(h);
}
function update(){
  [cover,...pages.map(c=>c.pg)].forEach((e,k)=>e.classList.toggle('t',k<p));
  const N=pages.length;
  ct.classList.toggle('on',p>0);
  $('pn').textContent=p>0?p+' / '+N:'';
  $('nx').disabled=p>=N;
}
function hearts(){
  for(let i=0;i<14;i++){
    const e=document.createElementNS('http://www.w3.org/2000/svg','svg');
    e.setAttribute('class','fh');e.innerHTML='<use href="#hrt"/>';
    e.style.setProperty('--x',(Math.random()*260-130)+'px');
    e.style.left=(40+Math.random()*20)+'%';e.style.animationDelay=(Math.random()*1.2)+'s';
    e.style.opacity=0;document.body.appendChild(e);setTimeout(()=>e.remove(),5000);
  }
}
function go(d){
  const n=Math.max(0,Math.min(pages.length,p+d)); if(n===p)return;
  const opening=p===0&&n===1; p=n; update(); if(opening)hearts();
}
const next=()=>go(1),prev=()=>go(-1);
$('nx').onclick=e=>{e.stopPropagation();next();};
$('pv').onclick=e=>{e.stopPropagation();prev();};
cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();});
book.addEventListener('click',e=>{
  if(p===0){next();return;}
  const r=book.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(x>.7)next();else if(x<.3)prev();
});
let sx=0,sy=0;
book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
book.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){e.preventDefault();dx<0?next():prev();}
},{passive:false});
for(let i=0;i<16;i++){
  const e=document.createElementNS('http://www.w3.org/2000/svg','svg');
  e.setAttribute('class','bs');e.innerHTML='<use href="#spk"/>';
  e.style.left=Math.random()*96+'%';e.style.top=Math.random()*96+'%';
  e.style.animationDelay=(Math.random()*4)+'s';e.style.width=e.style.height=(7+Math.random()*9)+'px';
  document.body.appendChild(e);
}
function init(){
  lastKey=size(); build(); update();
  let t;
  addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>{
    const k=size(); if(k===lastKey)return; lastKey=k;
    const ratio=p>0?(p-1)/pages.length:0; build();
    p=p>0?Math.min(pages.length,Math.floor(ratio*pages.length)+1):0; update();
  },250);});
}
size();
let started=false;const go1=()=>{if(started)return;started=true;try{init();}catch(e){const m=document.createElement('pre');m.style.cssText='position:fixed;top:8px;left:8px;right:8px;z-index:99;background:#fff;color:#900;padding:8px;font-size:12px;white-space:pre-wrap';m.textContent='Error: '+e.message;document.body.appendChild(m);}};
Promise.race([Promise.all([document.fonts.load('17px "EB Garamond"'),document.fonts.load('500 17px "EB Garamond"'),document.fonts.load('40px "Great Vibes"')]),new Promise(r=>setTimeout(r,2500))]).then(go1,go1);
</script>
</body>
</html>
